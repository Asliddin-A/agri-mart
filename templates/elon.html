<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yangi e'lon qo'shish | AgriEko</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/Eloncss.css">
</head>
<body>
<main class="page">
  <a href="/" style="display:inline-block;margin-bottom:12px;color:#15803d;font-weight:600;text-decoration:none">&larr; Bosh sahifa</a>
  <h1>Yangi e'lon joylashtirish</h1>
  <p class="sub">Sotadigan mahsulotingiz haqida ma'lumotlarni kiriting.</p>

  <div id="gate" class="card" style="display:none"><strong id="gateTitle"></strong><p id="gateText" class="sub" style="margin:0"></p><div id="gateLinks"></div></div>

  <form class="card" id="elonForm" style="display:none" action="/elon-yuborish" method="post" enctype="multipart/form-data">
    <p class="sub" id="sellerInfo" style="margin:0"></p>

    <label class="field"><span>Mahsulot nomi</span>
      <input type="text" name="title" maxlength="80" placeholder="Masalan: Samarqand qizil olmasi" required>
    </label>

    <label class="field"><span>Kategoriya</span>
      <select name="category" required>
        <option value="">Kategoriyani tanlang</option>
        <option>Sabzavotlar</option><option>Mevalar</option><option>Poliz</option><option>Ko'katlar</option>
      </select>
    </label>

    <label class="field"><span>Viloyat</span>
      <select name="region" required><option value="">Viloyatni tanlang</option><option value="Toshkent shahri">Toshkent shahri</option><option value="Toshkent viloyati">Toshkent viloyati</option><option value="Andijon">Andijon</option><option value="Buxoro">Buxoro</option><option value="Farg'ona">Farg'ona</option><option value="Jizzax">Jizzax</option><option value="Namangan">Namangan</option><option value="Navoiy">Navoiy</option><option value="Qashqadaryo">Qashqadaryo</option><option value="Samarqand">Samarqand</option><option value="Sirdaryo">Sirdaryo</option><option value="Surxondaryo">Surxondaryo</option><option value="Xorazm">Xorazm</option><option value="Qoraqalpog'iston Respublikasi">Qoraqalpog'iston Respublikasi</option></select>
    </label>

    <label class="field"><span>Narxi (1 kg)</span>
      <div class="input-suffix"><input type="number" name="price" inputmode="numeric" min="100" step="100" placeholder="4500" required><em>UZS</em></div>
    </label>

    <label class="field"><span>Umumiy hajm</span>
      <div class="input-suffix"><input type="number" name="quantity" inputmode="numeric" min="50" step="50" placeholder="5000" required><em>kg</em></div>
    </label>

    <label class="field"><span>Minimal buyurtma</span>
      <div class="input-suffix"><input type="number" name="min_order" inputmode="numeric" min="10" step="10" placeholder="200" required><em>kg</em></div>
    </label>

    <div class="field"><span>Mahsulot rasmi (ixtiyoriy)</span>
      <label class="drop">
        <input type="file" name="file-upload" id="fileInput" accept="image/png,image/jpeg" hidden>
        <strong id="fileName">Rasm yuklash</strong>
        <small>PNG yoki JPG, 5 MB gacha</small>
      </label>
    </div>

    <label class="field"><span>Qo'shimcha ma'lumot</span>
      <textarea name="description" rows="4" maxlength="500" placeholder="Holati, yetkazib berish shartlari"></textarea>
    </label>

    <button type="submit" class="submit">E'lonni joylashtirish</button>
  </form>
  <footer>&copy; 2026 AgriEko</footer>
</main>
<script>
  const f = document.getElementById('fileInput');
  f.addEventListener('change', () => {
    const file = f.files[0];
    if (file && file.size > 5 * 1024 * 1024) { alert("Rasm 5 MB dan katta bo'lmasligi kerak"); f.value = ''; return; }
    document.getElementById('fileName').textContent = file ? file.name : 'Rasm yuklash';
  });
  (async () => {
    const show = (t, x, links) => {
      document.getElementById('gateTitle').textContent = t;
      document.getElementById('gateText').textContent = x;
      document.getElementById('gateLinks').innerHTML = links;
      document.getElementById('gate').style.display = 'grid';
    };
    let me = null;
    try { me = (await (await fetch('/api/me')).json()).user; } catch (_) {}
    const a = 'style="color:#15803d;font-weight:700;margin-right:16px"';
    if (!me) return show("Avval tizimga kiring", "E'lon berish uchun sotuvchi sifatida ro'yxatdan o'tishingiz kerak.", `<a ${a} href="/?auth=register">Ro'yxatdan o'tish</a><a ${a} href="/?auth=login">Kirish</a>`);
    if (me.role !== 'seller') return show("Sotuvchi hisobi kerak", "Sizning hisobingiz xaridor uchun. E'lon berish uchun sotuvchi hisobi ochishingiz kerak.", `<a ${a} href="/">Bosh sahifa</a>`);
    document.getElementById('sellerInfo').textContent = `Sotuvchi: ${me.name} (@${me.telegram}, ${me.phone}) · ${me.verified ? 'tasdiqlangan' : 'tasdiqlanish kutilmoqda'}`;
    document.getElementById('elonForm').style.display = 'grid';
  })();
</script>
</body>
</html>
